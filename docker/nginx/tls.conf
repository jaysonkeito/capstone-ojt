# OJT Tracker — HTTPS vhost, used once Let's Encrypt certificates exist.
# Mounted over default.conf by docker-compose.tls.yml (see the guide): port 80
# only serves ACME challenges and redirects everything else; port 443 is the app.

server {
    listen 80;
    server_name norsubscojt.online www.norsubscojt.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/public;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name norsubscojt.online www.norsubscojt.online;

    ssl_certificate     /etc/letsencrypt/live/norsubscojt.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/norsubscojt.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    root /var/www/public;
    index index.php;

    client_max_body_size 25m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/public;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
