# OJT Tracker — HTTP vhost. This is the file the `web` service mounts by
# default: it serves everything behind a Cloudflare Tunnel (docker-compose
# profile "tunnel") and answers the ACME challenges Certbot needs before
# certificates exist. For direct Let's Encrypt, the guide swaps this file for
# tls.conf via docker-compose.tls.yml.

server {
    listen 80;
    server_name norsubscojt.online www.norsubscojt.online;

    root /var/www/public;
    index index.php;

    # Journal photos (5 MB) and Word template uploads need headroom.
    client_max_body_size 25m;

    # ACME HTTP-01 challenges — served from the shared certbot-www volume.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/public;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        # Resolve the app service at REQUEST time via Docker's embedded DNS
        # (127.0.0.11). A startup-time lookup of "app" fails hard when DNS
        # hiccups at container boot — nginx exits and the restart loop never
        # binds port 80. Variables defer resolution to the first request and
        # retry on every one after that.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
