; OJT Tracker production PHP settings.
; Journal photos cap at 5 MB and Word templates go well past that, so the
; upload ceiling is intentionally generous; Nginx mirrors it (client_max_body_size).

upload_max_filesize = 25M
post_max_size = 30M
max_execution_time = 120
memory_limit = 256M

date.timezone = Asia/Manila

; OPCache — the app is a fixed set of files per image, so validate timestamps
; only every 30s (rebuilds restart the container anyway).
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 30
opcache.memory_consumption = 128
