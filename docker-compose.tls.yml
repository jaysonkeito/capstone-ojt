# |--------------------------------------------------------------------------
# | TLS override — use together with docker-compose.yml once Let's Encrypt
# | certificates have been issued (the default.conf vhost answers the ACME
# | challenges first; see docs/deploy-docker.md, path A).
# |
# |   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d web
# |

services:
  web:
    ports:
      # Host port 8083 (the team reserves 80): the office firewall forwards
      # public 80 -> 192.168.101.3:8083, so Let's Encrypt's ACME challenges
      # and the HTTP->HTTPS redirect still arrive at the container's port 80.
      # Public 443 forwards to 443 for the app itself.
      - "8083:80"
      - "443:443"
    volumes:
      - ./docker/nginx/tls.conf:/etc/nginx/conf.d/default.conf:ro
      - public-www:/var/www/public:ro
      - certbot-www:/var/www/public/.well-known:ro
      - certbot-certs:/etc/letsencrypt:ro
