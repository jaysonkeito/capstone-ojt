<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4f46e5">
    <title>OJT Tracker — Offline</title>
    <style>
        :root { color-scheme: light; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               background: #f3f4f6; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #111827; }
        .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 40px 32px;
                max-width: 340px; margin: 24px; text-align: center; }
        .badge { width: 56px; height: 56px; border-radius: 14px; background: #4f46e5; margin: 0 auto 20px;
                 display: flex; align-items: center; justify-content: center; }
        h1 { font-size: 17px; margin: 0 0 8px; font-weight: 600; }
        p { font-size: 13.5px; line-height: 1.55; color: #6b7280; margin: 0; }
        button { margin-top: 24px; width: 100%; border: 0; border-radius: 10px; padding: 11px 16px;
                 background: #4f46e5; color: #fff; font-size: 14px; font-weight: 500; cursor: pointer; }
        button:active { background: #4338ca; }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/>
                <rect x="4" y="14" width="6" height="6" rx="1.5"/>
                <path d="M14.5 14.5h2m3 0h.01M14.5 20h2m3-5.5v.01M19.5 20h.01"/>
            </svg>
        </div>
        <h1>You're offline</h1>
        <p id="offline-copy">This page needs a connection the first time you open it. Your My QR Code page and anything you've looked at recently still work — try the back button.</p>
        <a id="open-dashboard" href="/intern/dashboard" class="hidden"
           style="display:block;margin-top:24px;width:100%;border:0;border-radius:10px;padding:11px 16px;background:#4f46e5;color:#fff;font-size:14px;font-weight:500;text-decoration:none;box-sizing:border-box;">Open my dashboard</a>
        <button onclick="location.reload()">Try again</button>
    </div>
    <script>
        // If this device has signed in before, its dashboard is cached — offer
        // a way in. A device that has never signed in genuinely needs a
        // connection: credentials can only be checked by the server.
        if (window.caches && (location.protocol === 'https:' || location.hostname === 'localhost')) {
            caches.match(location.origin + '/intern/dashboard').then((cached) => {
                if (cached) {
                    document.getElementById('open-dashboard').classList.remove('hidden');
                    document.getElementById('offline-copy').textContent =
                        "You can still use the app with the data from your last visit — your QR code works and journal entries you write will upload once you're back online.";
                }
            });
        }
    </script>
</body>
</html>
